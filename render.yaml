services:
  - type: web
    name: opentrips-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TABPFN_TOKEN
        sync: false
      - key: PLAN_CHECKPOINT_PATH
        sync: false
      - key: MODEL_ACCURACY
        sync: false
      - key: TINKER_API_KEY
        sync: false
